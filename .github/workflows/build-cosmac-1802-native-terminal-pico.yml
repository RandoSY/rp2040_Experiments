name: Build COSMAC 1802 Native Terminal Pico

on:
  workflow_dispatch:
  push:
    paths:
      - 'cosmac_1802_native_terminal_pico/**'
      - 'galileo_1802_pico/cdp1802.cpp'
      - 'galileo_1802_pico/cdp1802.h'
      - '.github/workflows/build-cosmac-1802-native-terminal-pico.yml'
  pull_request:
    paths:
      - 'cosmac_1802_native_terminal_pico/**'
      - 'galileo_1802_pico/cdp1802.cpp'
      - 'galileo_1802_pico/cdp1802.h'
      - '.github/workflows/build-cosmac-1802-native-terminal-pico.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CDP1802 ISA regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Igalileo_1802_pico \
            galileo_1802_pico/cdp1802.cpp \
            galileo_1802_pico/tests/test_1802_regression.cpp \
            -o /tmp/test_1802_regression
          /tmp/test_1802_regression

      - name: Validate audited v9 ROM image
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('cosmac_1802_native_terminal_pico')
          lengths=[25,1106,592,16,33,104,86,158,28,129,700,34,124]
          total=0
          for i,n in enumerate(lengths):
              t=(root/f'v9_seg{i}.h').read_text()
              m=re.search(r'="([0-9A-F]+)";',t)
              assert m, i
              data=bytes.fromhex(m.group(1))
              assert len(data)==n,(i,len(data),n)
              total+=len(data)
          assert total==3135,total
          assert bytes.fromhex(re.search(r'="([0-9A-F]+)";', (root/'v9_seg0.h').read_text()).group(1))[:4]==bytes.fromhex('F8C8BCF8')
          print('audited v9 ROM occupied bytes:',total)
          PY

      - name: Native microFORTH v9 regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Igalileo_1802_pico -Icosmac_1802_native_terminal_pico \
            galileo_1802_pico/cdp1802.cpp \
            cosmac_1802_native_terminal_pico/test_native_terminal_v9.cpp \
            -o /tmp/test_native_terminal_v9
          /tmp/test_native_terminal_v9

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-Pico 6.0.0
        run: |
          arduino-cli core update-index --additional-urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040@6.0.0 --additional-urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

      - name: Stage clean firmware sketch
        run: |
          rm -rf /tmp/cosmac_1802_native_terminal_pico_v9_fixed
          mkdir -p /tmp/cosmac_1802_native_terminal_pico_v9_fixed
          cp cosmac_1802_native_terminal_pico/cosmac_1802_native_terminal_pico.ino \
            /tmp/cosmac_1802_native_terminal_pico_v9_fixed/cosmac_1802_native_terminal_pico_v9_fixed.ino
          cp cosmac_1802_native_terminal_pico/native_rom_v9_segments.h \
            /tmp/cosmac_1802_native_terminal_pico_v9_fixed/native_rom_v9_segments.h
          cp galileo_1802_pico/cdp1802.cpp /tmp/cosmac_1802_native_terminal_pico_v9_fixed/cdp1802.cpp
          cp galileo_1802_pico/cdp1802.h /tmp/cosmac_1802_native_terminal_pico_v9_fixed/cdp1802.h
          sed -i 's/native_rom_v8_segments.h/native_rom_v9_segments.h/' \
            /tmp/cosmac_1802_native_terminal_pico_v9_fixed/cosmac_1802_native_terminal_pico_v9_fixed.ino
          sed -i 's/COSMAC1802 NATIVE FORTH V8 READY/COSMAC1802 NATIVE FORTH V9 READY/' \
            /tmp/cosmac_1802_native_terminal_pico_v9_fixed/cosmac_1802_native_terminal_pico_v9_fixed.ino
          grep -q 'native_rom_v9_segments.h' /tmp/cosmac_1802_native_terminal_pico_v9_fixed/cosmac_1802_native_terminal_pico_v9_fixed.ino
          test ! -e /tmp/cosmac_1802_native_terminal_pico_v9_fixed/test_native_terminal_v9.cpp

      - name: Compile audited native-terminal Pico UF2
        run: |
          mkdir -p build/cosmac_1802_native_terminal_pico
          arduino-cli compile \
            --fqbn 'rp2040:rp2040:rpipico:flash=2097152_65536,usbstack=picosdk,opt=Optimize2' \
            --warnings all \
            --output-dir build/cosmac_1802_native_terminal_pico \
            /tmp/cosmac_1802_native_terminal_pico_v9_fixed
          UF2="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.uf2' | head -1)"
          ELF="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.elf' | head -1)"
          test -n "$UF2"
          test -n "$ELF"
          cp "$UF2" build/cosmac_1802_native_terminal_pico/COSMAC_1802_NATIVE_MICROFORTH_PICO_v9_USB_FIXED.uf2
          find build/cosmac_1802_native_terminal_pico -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Verify firmware image is the sketch, not the host regression executable
        run: |
          ELF="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.elf' | head -1)"
          strings "$ELF" | grep -q 'COSMAC1802 NATIVE FORTH V9 READY'
          strings "$ELF" | grep -q 'Pico Serial'
          if strings "$ELF" | grep -q 'native terminal v9 regression: PASS'; then
            echo 'ERROR: host regression main leaked into Pico firmware'
            exit 1
          fi
          echo 'Firmware entry/USB string audit: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: cosmac-1802-native-microforth-v9-usb-fixed
          path: |
            build/cosmac_1802_native_terminal_pico/COSMAC_1802_NATIVE_MICROFORTH_PICO_v9_USB_FIXED.uf2
            build/cosmac_1802_native_terminal_pico/*.elf
            build/cosmac_1802_native_terminal_pico/*.bin
          if-no-files-found: error
