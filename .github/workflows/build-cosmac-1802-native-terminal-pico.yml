name: Build COSMAC 1802 Native Terminal Pico

on:
  workflow_dispatch:
  push:
    paths:
      - 'cosmac_1802_native_terminal_pico/**'
      - 'galileo_1802_pico/cdp1802.cpp'
      - 'galileo_1802_pico/cdp1802.h'
      - '.github/workflows/build-cosmac-1802-native-terminal-pico.yml'
  pull_request:
    paths:
      - 'cosmac_1802_native_terminal_pico/**'
      - 'galileo_1802_pico/cdp1802.cpp'
      - 'galileo_1802_pico/cdp1802.h'
      - '.github/workflows/build-cosmac-1802-native-terminal-pico.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CDP1802 ISA regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Igalileo_1802_pico \
            galileo_1802_pico/cdp1802.cpp \
            galileo_1802_pico/tests/test_1802_regression.cpp \
            -o /tmp/test_1802_regression
          /tmp/test_1802_regression

      - name: Validate split single-source v10 ROM image
        run: |
          python3 - <<'PY'
          import pathlib,re,hashlib
          root=pathlib.Path('cosmac_1802_native_terminal_pico')
          image=bytearray()
          for i in range(16):
              t=(root/f'v10_seg{i:02d}.h').read_text()
              m=re.search(r'="([0-9A-F]+)";',t)
              assert m, i
              data=bytes.fromhex(m.group(1))
              assert len(data)==512,(i,len(data))
              image.extend(data)
          data=bytes(image)
          digest=hashlib.sha256(data).hexdigest()
          assert len(data)==0x2000,len(data)
          assert digest=='6480cf7f8d20533d35b1834ee64a895fba7a85e8a6d2fc3ff761828d2942210f',digest
          assert data[:4]==bytes.fromhex('F8C8BCF8')
          assert b'COSMAC 1802 microFORTH v10' in data
          assert b'IF ELSE THEN' in data
          assert b'BEGIN AGAIN UNTIL' in data
          assert b'DO LOOP' in data
          print('v10 ROM bytes:',len(data))
          print('v10 ROM SHA256:',digest)
          PY

      - name: Native microFORTH v10 regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Igalileo_1802_pico -Icosmac_1802_native_terminal_pico \
            galileo_1802_pico/cdp1802.cpp \
            cosmac_1802_native_terminal_pico/test_native_terminal_v10.cpp \
            -o /tmp/test_native_terminal_v10
          /tmp/test_native_terminal_v10

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-Pico 6.0.0
        run: |
          arduino-cli core update-index --additional-urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040@6.0.0 --additional-urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

      - name: Stage clean v10 firmware sketch from exact regression ROM
        run: |
          rm -rf /tmp/cosmac_1802_native_terminal_pico_v10
          mkdir -p /tmp/cosmac_1802_native_terminal_pico_v10
          cp cosmac_1802_native_terminal_pico/cosmac_1802_native_terminal_pico.ino \
            /tmp/cosmac_1802_native_terminal_pico_v10/cosmac_1802_native_terminal_pico_v10.ino
          cp cosmac_1802_native_terminal_pico/native_rom_v10.h \
            /tmp/cosmac_1802_native_terminal_pico_v10/native_rom_v10.h
          cp cosmac_1802_native_terminal_pico/native_rom_v10_split.h \
            /tmp/cosmac_1802_native_terminal_pico_v10/native_rom_v10_split.h
          cp cosmac_1802_native_terminal_pico/v10_seg*.h \
            /tmp/cosmac_1802_native_terminal_pico_v10/
          cp galileo_1802_pico/cdp1802.cpp /tmp/cosmac_1802_native_terminal_pico_v10/cdp1802.cpp
          cp galileo_1802_pico/cdp1802.h /tmp/cosmac_1802_native_terminal_pico_v10/cdp1802.h
          grep -q 'native_rom_v10.h' /tmp/cosmac_1802_native_terminal_pico_v10/cosmac_1802_native_terminal_pico_v10.ino
          grep -q 'RX_CAP = 1024' /tmp/cosmac_1802_native_terminal_pico_v10/cosmac_1802_native_terminal_pico_v10.ino
          grep -q 'native_rom_v10_split.h' /tmp/cosmac_1802_native_terminal_pico_v10/native_rom_v10.h
          test ! -e /tmp/cosmac_1802_native_terminal_pico_v10/test_native_terminal_v10.cpp

      - name: Compile native-control Forth Pico UF2
        run: |
          rm -rf build/cosmac_1802_native_terminal_pico
          mkdir -p build/cosmac_1802_native_terminal_pico
          arduino-cli compile \
            --fqbn 'rp2040:rp2040:rpipico:flash=2097152_65536,usbstack=picosdk,opt=Optimize2' \
            --warnings all \
            --output-dir build/cosmac_1802_native_terminal_pico \
            /tmp/cosmac_1802_native_terminal_pico_v10
          UF2="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.uf2' | head -1)"
          ELF="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.elf' | head -1)"
          test -n "$UF2"
          test -n "$ELF"
          cp "$UF2" build/cosmac_1802_native_terminal_pico/COSMAC_1802_NATIVE_MICROFORTH_PICO_v10_CONTROL_FORTH.uf2
          find build/cosmac_1802_native_terminal_pico -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Production firmware integrity audit
        run: |
          ELF="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.elf' | head -1)"
          strings -a "$ELF" > /tmp/elf_strings.txt
          grep -q 'COSMAC1802 NATIVE FORTH V10 READY' /tmp/elf_strings.txt
          grep -q 'Pico Serial' /tmp/elf_strings.txt
          grep -q 'COSMAC 1802 microFORTH v10' /tmp/elf_strings.txt
          if grep -q 'native terminal v10 regression: PASS' /tmp/elf_strings.txt; then
            echo 'ERROR: host regression main leaked into Pico firmware'
            exit 1
          fi
          echo 'Production entry/USB/native-ROM audit: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: cosmac-1802-native-microforth-v10-control-forth
          path: |
            build/cosmac_1802_native_terminal_pico/COSMAC_1802_NATIVE_MICROFORTH_PICO_v10_CONTROL_FORTH.uf2
            build/cosmac_1802_native_terminal_pico/*.elf
            build/cosmac_1802_native_terminal_pico/*.bin
          if-no-files-found: error
