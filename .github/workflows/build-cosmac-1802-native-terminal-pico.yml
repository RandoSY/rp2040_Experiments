name: Build COSMAC 1802 Native Terminal Pico

on:
  workflow_dispatch:
  push:
    paths:
      - 'cosmac_1802_native_terminal_pico/**'
      - 'galileo_1802_pico/cdp1802.cpp'
      - 'galileo_1802_pico/cdp1802.h'
      - '.github/workflows/build-cosmac-1802-native-terminal-pico.yml'
  pull_request:
    paths:
      - 'cosmac_1802_native_terminal_pico/**'
      - 'galileo_1802_pico/cdp1802.cpp'
      - 'galileo_1802_pico/cdp1802.h'
      - '.github/workflows/build-cosmac-1802-native-terminal-pico.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CDP1802 ISA regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Igalileo_1802_pico \
            galileo_1802_pico/cdp1802.cpp \
            galileo_1802_pico/tests/test_1802_regression.cpp \
            -o /tmp/test_1802_regression
          /tmp/test_1802_regression

      - name: Validate native ROM segment image
        run: |
          python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('cosmac_1802_native_terminal_pico/native_rom_v8_segments.h').read_text()
          segs={int(n):bytes.fromhex(''.join(parts)) for n,body in re.findall(r'MF_SEG(\d+)_HEX\[\]\s*=\s*(.*?);',p,re.S) for parts in [[x for x in re.findall(r'"([0-9A-F]+)"',body)]]}
          rows=re.findall(r'\{0x([0-9A-F]{4}),\s*(\d+),\s*MF_SEG(\d+)_HEX\}',p)
          assert len(rows)==11, len(rows)
          total=0
          for addr,n,idx in rows:
              data=segs[int(idx)]
              assert len(data)==int(n),(idx,len(data),n)
              total+=len(data)
          assert total==2524,total
          assert segs[0][:4]==bytes.fromhex('F8C8BCF8')
          print('native ROM occupied bytes:',total)
          PY

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-Pico 6.0.0
        run: |
          arduino-cli core update-index --additional-urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040@6.0.0 --additional-urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

      - name: Stage generic CDP1802 core
        run: |
          cp galileo_1802_pico/cdp1802.cpp cosmac_1802_native_terminal_pico/cdp1802.cpp
          cp galileo_1802_pico/cdp1802.h cosmac_1802_native_terminal_pico/cdp1802.h

      - name: Compile stand-alone native-terminal Pico UF2
        run: |
          mkdir -p build/cosmac_1802_native_terminal_pico
          arduino-cli compile \
            --fqbn 'rp2040:rp2040:rpipico:flash=2097152_65536,usbstack=picosdk,opt=Optimize2' \
            --warnings all \
            --output-dir build/cosmac_1802_native_terminal_pico \
            cosmac_1802_native_terminal_pico
          UF2="$(find build/cosmac_1802_native_terminal_pico -maxdepth 1 -name '*.uf2' | head -1)"
          test -n "$UF2"
          cp "$UF2" build/cosmac_1802_native_terminal_pico/COSMAC_1802_NATIVE_MICROFORTH_PICO.uf2
          find build/cosmac_1802_native_terminal_pico -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: cosmac-1802-native-microforth-pico
          path: |
            build/cosmac_1802_native_terminal_pico/COSMAC_1802_NATIVE_MICROFORTH_PICO.uf2
            build/cosmac_1802_native_terminal_pico/*.elf
            build/cosmac_1802_native_terminal_pico/*.bin
          if-no-files-found: error
